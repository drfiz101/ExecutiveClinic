<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b67">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one working column — month bar, tabs, then the active view; statement/summary render as paper sheets */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --paper:#ffffff; --ink:#14282b; --muted:#5d7275; --line:#d9e2e2; --soft:#e9efef;
  --accent:#0d6b67; --accent-ink:#ffffff; --accent-soft:#dcefed;
  --morning:#a35d00; --morning-soft:#fdf0db; --evening:#3f4aa8; --evening-soft:#e6e8fa;
  --danger:#b3261e; --danger-soft:#fbe5e3; --good:#1d7a43;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1819; --surface:#162224; --paper:#1a2729; --ink:#e3ecec; --muted:#93a8aa; --line:#2b3b3d; --soft:#203032;
  --accent:#4fbdb5; --accent-ink:#06201e; --accent-soft:#183a38;
  --morning:#f0b45a; --morning-soft:#3a2b14; --evening:#9fa8f5; --evening-soft:#242a52;
  --danger:#f2938c; --danger-soft:#3d1d1b; --good:#6fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1819; --surface:#162224; --paper:#1a2729; --ink:#e3ecec; --muted:#93a8aa; --line:#2b3b3d; --soft:#203032;
  --accent:#4fbdb5; --accent-ink:#06201e; --accent-soft:#183a38;
  --morning:#f0b45a; --morning-soft:#3a2b14; --evening:#9fa8f5; --evening-soft:#242a52;
  --danger:#f2938c; --danger-soft:#3d1d1b; --good:#6fd39a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.brandlogo{width:52px;height:52px;flex:none}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:.85rem}
.monthbar{display:flex;align-items:center;gap:6px}
.monthbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;font-size:1rem}
.iconbtn:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tile .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--f-num);font-size:1.2rem;font-weight:600}
.tile.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hl .lbl{color:inherit;opacity:.85}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:1rem;font-weight:700}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:150px 170px 1fr 1fr 130px auto;gap:10px;align-items:end}
@media (max-width:860px){.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"][data-v="morning"]{background:var(--morning-soft);color:var(--morning)}
.seg button[aria-pressed="true"][data-v="evening"]{background:var(--evening-soft);color:var(--evening)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 16px;font-weight:700;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.plain{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85rem}
.err{color:var(--danger);font-size:.85rem}

/* tables */
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
.ledger th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.ledger td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.ledger td.r,.ledger th.r{text-align:right}
.ledger tr.editing td{background:var(--accent-soft)}
.ledger tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--line)}
.act{display:flex;gap:4px;justify-content:flex-end}
.act button{border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:6px;font-size:.82rem;font-weight:600}
.act button:hover{background:var(--soft);color:var(--ink)}
.act button.del:hover{background:var(--danger-soft);color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.chip.morning{background:var(--morning-soft);color:var(--morning)}
.chip.evening{background:var(--evening-soft);color:var(--evening)}
@media (max-width:560px){.ledger td:last-child,.ledger th:last-child{display:none}.ledger td,.ledger th{padding:7px 5px;font-size:.84rem}.ledger td:first-child,.ledger th:first-child{display:none}.ledger th{white-space:normal}.ledger .yy{display:none}.ledger tbody tr{cursor:pointer}.mobonly{display:inline}}
.mobonly{display:none}
.prep{font-size:.9rem;margin-top:10px;display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.prep img{height:76px;width:auto}
.prep.pmorn{display:none}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:6px}
.sbox{border:1.5px solid var(--ink);padding:10px 12px;font-size:.85rem;line-height:1.35;display:flex;flex-direction:column;min-height:150px;break-inside:avoid}
.sbox .sline{margin-top:auto;padding-top:22px;display:flex;align-items:flex-end;gap:4px}
.sbox .sline span{flex:1;border-bottom:1px solid var(--ink);height:1em;position:relative}
.sbox .sline.signed{padding-top:4px}
.sbox .sline.signed img{height:84px;width:auto;max-width:72%;margin-bottom:-6px}
.sigprev{height:70px;width:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
.billgrp{display:flex;flex-direction:column;gap:10px}
.billh{font-size:.95rem;margin:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--bg);aspect-ratio:3/4;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.billview{position:fixed;inset:0;z-index:30;background:rgba(10,20,22,.92);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.bvbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#fff;font-size:.9rem}
.bvimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.bvimg img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px}
@media print{.billview{display:none!important}}
.splitline{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
#printArea{display:none}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--paper:#fff;--ink:#000;--muted:#333;--line:#888;--soft:#eee;--accent:#0d6b67;--accent-soft:#e3efee;--danger:#000;color-scheme:light}
  @page{size:A4;margin:0}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body{background:#fff}
  #printArea .paper{border:0;box-shadow:none;border-radius:0;padding:12mm 14mm;max-width:none;gap:12px}
  #printArea .scroll{overflow:visible}
  #printArea tr{break-inside:avoid}
  #printArea .sheet{font-size:10pt}
  #printArea .sheet th,#printArea .sheet td{padding:2px 6px}
  #printArea .evehead{break-before:page;padding-top:12mm}
  #printArea .printonly{display:block}
  #printArea .ph{gap:24px}
  #printArea .ph .phtext{gap:0}
  #printArea .ph .phlogo{height:60px;width:60px}
  #printArea .signs{grid-template-columns:repeat(3,1fr)}
  #printArea .sum td{padding:4px 10px;font-size:10pt}
  #printArea .prep.pmorn{display:flex}
  #printArea .prep{margin-top:4px}
  #printArea .prep img{height:62px}
  #printArea .sheet{font-size:9.5pt}
  #printArea .sheet th,#printArea .sheet td{padding:1.5px 6px}
  #printArea .sbox{min-height:140px}
  #printArea .sbox{min-height:125px;font-size:9.5pt}
  #printArea .cc{font-size:9.5pt}
  .pbreak{break-before:page;height:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.exp .calc{font-family:var(--f-num);font-size:.8rem;color:var(--muted);min-height:1.2em}

/* paper */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 var(--line),0 12px 30px -20px rgba(0,0,0,.35);padding:clamp(18px,4vw,44px);max-width:780px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px}
.paper .ph{display:flex;align-items:center;justify-content:center;gap:16px}
.paper .ph .phtext{text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.paper .ph .phlogo{height:64px;width:64px;flex:none}
@media (max-width:560px){.paper .ph{gap:10px}.paper .ph .phlogo{height:46px;width:46px}.paper .ph .phtext h2{font-size:1.1rem}}
.printonly{display:none}
.evehead{display:flex;flex-direction:column;gap:12px}
.paper .ph h2{font-size:1.35rem;letter-spacing:.08em}
.paper .ph .sub{font-weight:600;letter-spacing:.04em}
.paper .ph .mo{color:var(--ink);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:1.02rem}
.paper h3{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
.sheet{font-size:.88rem}
.sheet th,.sheet td{border:1px solid var(--line);padding:5px 8px}
.sheet th{background:var(--soft);font-size:.72rem;letter-spacing:.06em;text-align:left}
.sheet td.r,.sheet th.r{text-align:right}
.sheet tr.sub td{font-weight:700;background:var(--soft)}
.sheet tr.grand td{font-weight:700;font-size:1rem;background:var(--accent-soft)}
.sum td{padding:7px 10px;border-bottom:1px solid var(--soft)}
.sum td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum tr.sec td,.sum tr.sec td:last-child{text-align:left;font-family:var(--f-body);font-weight:700;letter-spacing:.08em;font-size:.8rem;background:var(--soft);border-bottom:0}
.sum tr.minus td:first-child{color:var(--muted)}
.sum tr.minus td:last-child{color:var(--danger)}
.sum tr.strong td{font-weight:700}
.sum tr.net td{font-weight:700;font-size:1.05rem;background:var(--accent-soft);border-bottom:0}
.cc{font-size:.85rem;display:flex;flex-direction:column;gap:2px}
.cc ul{margin:4px 0 0;padding-left:20px}

.yr td,.yr th{white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.7}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700}
.banner{background:var(--morning-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:.9rem}
.shares{display:flex;flex-direction:column;gap:8px}
.sharerow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.tile,.panel{transition:border-color .15s}}

.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.sync.ok{background:var(--accent-soft);color:var(--accent)}
.sync.wait{background:var(--morning-soft);color:var(--morning)}
.acct{display:flex;justify-content:flex-end;gap:10px;align-items:center;color:var(--muted);font-size:.82rem;margin-top:-8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.loginwrap{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logincard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.logincard h1{font-size:1.3rem}
.lmark{width:84px;height:84px;align-self:center}
.logincard h1{text-align:center}
html,body{min-height:100%}
</style>

<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<div id="login" class="loginwrap" hidden>
  <form id="loginForm" class="logincard" data-mode="in" autocomplete="on">
    <img class="lmark" src="icons/gu-logo.png" alt="Gandhara University">
    <h1>Executive Clinic Ledger</h1>
    <p class="hint" id="lTitle">Sign in</p>
    <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" minlength="6" required></div>
    <button class="btn" id="lGo" type="submit">Sign in</button>
    <div id="loginMsg" class="err" role="status"></div>
    <div class="btnrow" style="justify-content:space-between"><button type="button" class="linkbtn" id="lSwitch">New here? Create an account</button><button type="button" class="linkbtn" id="lForgot">Forgot password</button></div>
    <p class="hint" style="margin:0">Use the same email on your phone and computer and your records stay in sync.</p>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brandrow"><img class="brandlogo" src="icons/gu-logo.png" alt="Gandhara University"><div class="brand"><h1 id="brandTitle">EXECUTIVE CLINIC</h1><span id="brandSub">Dr. Muhammad Faizan Malik · patient records &amp; monthly statement</span></div></div>
    <div class="topright"><span id="sync" class="sync" hidden></span><div class="monthbar">
      <button class="iconbtn" id="prevM" aria-label="Previous month">‹</button>
      <select id="monthSel" aria-label="Month"></select>
      <button class="iconbtn" id="nextM" aria-label="Next month">›</button>
    </div></div>
  </header>
  <nav class="tabs" aria-label="Views">
    <a href="#records" data-tab="records">Records</a>
    <a href="#statement" data-tab="statement">Statement</a>
    <a href="#summary" data-tab="summary">Summary</a>
    <a href="#year" data-tab="year">Year</a>
    <a href="#shares" data-tab="shares">Settings</a>
  </nav>
  <div id="banner" class="banner" hidden></div>
  <div class="acct"><span id="who"></span><button class="linkbtn" id="signOut">Sign out</button></div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="printArea"></div>
<div id="billView" class="billview" hidden role="dialog" aria-label="Bill photo"></div>

<script>
(function(){
"use strict";
// ---------- Firebase (same project as Dental Solutions) ----------
const clone=o=>JSON.parse(JSON.stringify(o));
let fsdb=null, uidNow=null, unsubs=[], pending=false;
function makeDB(fs,uid){
  const root=fs.collection("ledgers").doc(uid);
  return {
    doc(path){const [c,id]=path.split("/");const ref=(c==="months"?root.collection("months"):root.collection("config")).doc(id);
      return {
        set:d=>c==="months"?ref.set(d,{merge:true}):ref.set(d),
        update:d=>ref.set(d,{merge:true}),
        onSnapshot:(n,e)=>ref.onSnapshot(s=>n({exists:s.exists,data:()=>s.data()}),e)
      }},
    collection(){return {onSnapshot:(n,e)=>root.collection("months").onSnapshot({includeMetadataChanges:true},s=>{pending=s.metadata.hasPendingWrites;syncChip();n(s)},e)}},
    watchBills:(k,n,e)=>root.collection("bills").where("month","==",k).onSnapshot(s=>n(s.docs.map(d=>Object.assign({id:d.id},d.data()))),e),
    addBill:d=>root.collection("bills").add(d),
    delBill:id=>root.collection("bills").doc(id).delete(),
    replaceMonths:async(obj)=>{const ks=Object.keys(obj);for(let i=0;i<ks.length;i+=400){const b=fs.batch();ks.slice(i,i+400).forEach(k=>b.set(root.collection("months").doc(k),obj[k]));await b.commit()}}
  };
}
function syncChip(){
  const el=document.getElementById("sync"); if(!el) return;
  const off=!navigator.onLine;
  el.hidden=!uidNow;
  el.className="sync "+(pending||off?"wait":"ok");
  el.textContent=pending?(off?"Saved on phone · uploads when online":"Uploading…"):(off?"Offline · showing saved copy":"All saved online");
}
window.addEventListener("online",syncChip);window.addEventListener("offline",syncChip);
function saveFile(filename,data,type){
  const blob=new Blob([data],{type});
  try{const file=new File([blob],filename,{type});
    if(navigator.canShare&&/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare({files:[file]})){return navigator.share({files:[file],title:filename}).catch(()=>{})}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const localDownloads={async save({filename,data}){await saveFile(filename,data,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");return{status:"saved"}}};
function backupHTML(){
  const n=Object.values(months).reduce((a,m)=>a+Object.values(m.records||{}).filter(r=>r&&!r.deleted).length,0);
  return `<section class="panel"><div class="panel-head"><h2>Import and backup</h2><span class="hint">${n} records in your account</span></div>

const fmt=n=>{const v=Math.round((+n||0)*100)/100;return v.toLocaleString("en-PK",{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2})};
const rs=n=>"Rs "+fmt(n);
function calc(x){ // simple arithmetic: 850*4, 850+850, 16750-1700
  if(x==null) return 0; x=String(x).replace(/,/g,"").replace(/\s/g,"").replace(/^=/,"");
  if(x==="") return 0;
  if(!/^[-+*/.\dx×]+$/i.test(x)) return NaN;
  x=x.replace(/[x×]/gi,"*");
  const terms=x.match(/[+-]?[^+-]+/g); if(!terms) return NaN;
  let total=0;
  for(const t of terms){
    let sign=1,s=t; if(s[0]==="+"||s[0]==="-"){sign=s[0]==="-"?-1:1;s=s.slice(1)}
    const parts=s.split(/([*/])/); let v=parseFloat(parts[0]);
    for(let i=1;i<parts.length;i+=2){const n=parseFloat(parts[i+1]);v=parts[i]==="*"?v*n:v/n}
    if(!isFinite(v)) return NaN; total+=sign*v;
  }
  return total;
}
function monthLabel(k){const [y,m]=k.split("-");return MFULL[+m-1]+" "+y}
function shiftKey(k,d){let [y,m]=k.split("-").map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")}
function ddmmyy(iso){const [y,m,d]=iso.split("-");return +d+"/"+(+m)+"/"+y.slice(2)}
function recs(k){
  const r=(months[k]&&months[k].records)||{};
  return Object.entries(r).filter(([,v])=>v&&!v.deleted).map(([id,v])=>Object.assign({id},v))
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||0)-(b.at||0));
}
function compute(k){
  const all=recs(k), m=all.filter(r=>r.shift!=="evening"), e=all.filter(r=>r.shift==="evening");
  const ex=(months[k]&&months[k].exp)||{}, S=settings;
  const sum=a=>a.reduce((s,r)=>s+(+r.charges||0),0);
  const o={m,e,mInc:sum(m),eInc:sum(e)};
  ["mMat","mLab","eMat","eLab"].forEach(f=>{const v=calc(ex[f]);o[f]=isFinite(v)?v:0});
  // One material cost for the month, split by each shift's share of the income
  const T=calc(ex.mat);
  if(ex.mat!=null&&String(ex.mat).trim()!==""&&isFinite(T)){
    const inc=o.mInc+o.eInc;
    o.mMat=inc?Math.round(T*o.mInc/inc):T; o.eMat=T-o.mMat;
    o.matSplit=true; o.matTotal=T; o.mPct=inc?o.mInc/inc*100:100; o.ePct=100-o.mPct;
  }
  o.mRem=o.mInc-o.mMat-o.mLab;
  o.mHosp=o.mRem*S.mHospital/100; o.mDoc=o.mRem*(100-S.mHospital)/100;
  o.eRem=o.eInc-o.eMat-o.eLab;
  o.eDoc=o.eRem*S.eDoctor/100;
  o.eShares=S.eShares.map(s=>({name:s.name,pct:+s.pct,amt:o.eRem*(+s.pct)/100}));
  o.docTotal=o.mDoc+o.eDoc; o.tax=o.docTotal*S.tax/100; o.net=o.docTotal-o.tax;
  o.total=o.mInc+o.eInc; o.count=all.length;
  return o;
}

        } else {
          const id=uid();
          await patchMonth(k,{records:{[id]:{date,shift:sh,patient:pat,procedure:proc,charges:chg,at:Date.now()}}});
          shift=sh;
          if(k!==cur){cur=k}
          toast(`Added ${pat} · ${rs(chg)}`);
        }
        render(); const p=$("#fPat"); if(p) p.focus();
      }catch(x){writeErr(x)}
    };
    const ce=$("#cancelEdit"); if(ce) ce.onclick=()=>{editing=null;render()};
  }
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editing={key:cur,id:b.dataset.edit};const r=recs(cur).find(x=>x.id===b.dataset.edit);if(r)shift=r.shift;render();window.scrollTo({top:0,behavior:"smooth"})});
  document.querySelectorAll("[data-row]").forEach(tr=>tr.onclick=e=>{if(!canWrite||window.innerWidth>560||e.target.closest("button"))return;editing={key:cur,id:tr.dataset.row};const r=recs(cur).find(x=>x.id===tr.dataset.row);if(r)shift=r.shift;render();window.scrollTo({top:0,behavior:"smooth"})});
  const de=$("#delEdit"); if(de) de.onclick=()=>{const id=editing.id;editing=null;delRec(id,cur)};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delRec(b.dataset.del,cur));
  async function delRec(id,k){
    { const r=recs(k).find(x=>x.id===id);
    try{await patchMonth(k,{records:{[id]:{deleted:true}}}); if(editing&&editing.id===id)editing=null; render();
      toast(`Deleted ${r?r.patient:"record"}`,async()=>{try{await patchMonth(k,{records:{[id]:{deleted:false}}});render()}catch(x){writeErr(x)}});
    }catch(x){writeErr(x)}
  }}
  document.querySelectorAll("[data-exp]").forEach(inp=>{
    const f=inp.dataset.exp;
    inp.oninput=()=>{const v=inp.value,n=calc(v);$("#c_"+f).textContent=v&&/[-+*/x×]/i.test(v.slice(1))?(isFinite(n)?"= "+fmt(n):"Not a valid amount"):(v&&!isFinite(n)?"Not a valid amount":"")};
    inp.onchange=async()=>{
      const v=inp.value.trim(); if(v&&!isFinite(calc(v))) return;
      const old=(months[cur]&&months[cur].exp&&months[cur].exp[f])??"";
      if(v===old) return;
      try{await patchMonth(cur,{exp:{[f]:v}});toast("Deductions saved")}catch(x){writeErr(x)}
    };
  });
  document.querySelectorAll("[data-open]").forEach(a=>a.onclick=()=>{cur=a.dataset.open});
  const cs=$("#copySum"); if(cs) cs.onclick=copySummary;
  const dx=$("#dlX"); if(dx) dx.onclick=downloadExcel;
  const pb=$("#pdfBtn"); if(pb) pb.onclick=savePDF;
  const p2=$("#prBoth"); if(p2) p2.onclick=()=>{ if(/Android|iPhone|iPad/i.test(navigator.userAgent)) savePDF(); else doPrint(true); };
  // settings
  const ss=$("#saveSet");
  if(ss){
    const upd=()=>{const ed=+$("#sED").value||0;const sum=ed+[...document.querySelectorAll(".shp")].reduce((a,i)=>a+(+i.value||0),0);$("#eTot").textContent="Evening total "+sum+"%"+(Math.abs(sum-100)>0.001?" — should be 100%":"");$("#eTot").className=Math.abs(sum-100)>0.001?"err":"hint";const mh=+$("#sMH").value;$("#sMD").value=isFinite(mh)?100-mh:""};
    document.querySelectorAll("#view input").forEach(i=>i.addEventListener("input",upd)); upd();
    const sf=$("#sigFile");
    if(sf) sf.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=async()=>{
      const sc=Math.min(1,600/im.width),cv=document.createElement("canvas");cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);const url=cv.toDataURL("image/png");
      try{const d=Object.assign({},settings,{sigImg:url});await db.doc("config/settings").set(d);settings=d;loadSig();toast("Signature saved");render()}catch(x){writeErr(x)}};im.src=rd.result};rd.readAsDataURL(f)};
    const sd=$("#sigDel"); if(sd) sd.onclick=async()=>{try{const d=Object.assign({},settings);delete d.sigImg;await db.doc("config/settings").set(d);settings=d;loadSig();toast("Signature removed");render()}catch(x){writeErr(x)}};
    const readSigns=()=>[0,1,2].map(i=>({head:$("#sgH"+i).value.trim(),name:$("#sgN"+i).value.trim(),title:$("#sgT"+i).value.trim()}));
    const readShares=()=>[...document.querySelectorAll(".sharerow")].map(r=>({name:r.querySelector(".shn").value.trim().toUpperCase(),pct:+r.querySelector(".shp").value||0}));
    $("#addShare").onclick=()=>{settings=Object.assign({},settings,{eShares:readShares().concat([{name:"",pct:0}])});keepDraft();};
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const s=readShares();s.splice(+b.dataset.rm,1);settings=Object.assign({},settings,{eShares:s});keepDraft()});
    function keepDraft(){const d={clinic:$("#sClinic").value,doctorFull:$("#sFull").value,doctor:$("#sDoc").value,mHospital:+$("#sMH").value,eDoctor:+$("#sED").value,tax:+$("#sTax").value,signs:readSigns(),softCopy:$("#sCC").value.split("\n").map(s=>s.trim()).filter(Boolean)};settings=Object.assign({},settings,d);render()}
    ss.onclick=async()=>{
      const d={clinic:$("#sClinic").value.trim()||DEF.clinic,doctorFull:$("#sFull").value.trim()||DEF.doctorFull,doctor:$("#sDoc").value.trim().toUpperCase()||DEF.doctor,
        mHospital:+$("#sMH").value,eDoctor:+$("#sED").value,tax:+$("#sTax").value,eShares:readShares().filter(s=>s.name),signs:readSigns().filter(x=>x.head||x.name),softCopy:$("#sCC").value.split("\n").map(s=>s.trim()).filter(Boolean)};
      if(![d.mHospital,d.eDoctor,d.tax].every(n=>isFinite(n)&&n>=0&&n<=100)){$("#setMsg").textContent="Percentages must be between 0 and 100.";$("#setMsg").className="err";return}
      if(settings.sigImg)d.sigImg=settings.sigImg;
      try{await db.doc("config/settings").set(d);settings=Object.assign({},DEF,d);toast("Shares and names saved");render()}catch(x){writeErr(x)}
    };
    $("#resetSet").onclick=()=>{settings=Object.assign({},DEF);render();$("#setMsg").textContent="Defaults filled in. Press Save to keep them.";};
  }
}

// ---------- exports ----------
function summaryText(){
  const c=compute(cur),S=settings,[y,m]=cur.split("-");
  const L=(l,v)=>`${l}: ${fmt(v)}`;
  return [`${S.clinic} — SUMMARY ${MN[+m-1]} ${y}`,"","MORNING TIME",L("Total income",c.mInc),L("Material (subtract)",c.mMat),L("Lab charges (subtract)",c.mLab),L("Total remaining",c.mRem),L(`Hospital share ${S.mHospital}%`,c.mHosp),L(`${S.doctor} share ${100-S.mHospital}%`,c.mDoc),"",
   "EVENING TIME",L("Total income",c.eInc),...(c.eMat||c.matSplit?[L("Material (subtract)",c.eMat)]:[]),L("Lab charges (subtract)",c.eLab),L("Total remaining",c.eRem),L(`${S.doctor} share ${S.eDoctor}%`,c.eDoc),...c.eShares.map(s=>L(`${s.name} share ${s.pct}%`,s.amt)),"",
   L(`${S.doctor} total share`,c.docTotal),L(`${S.tax}% tax`,c.tax),L(`${S.doctor} total after tax deduction`,c.net)].join("\n");
}
async function copySummary(){
  const t=summaryText();
  try{await navigator.clipboard.writeText(t);toast("Summary copied")}
  catch(e){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Summary copied")}catch(_){toast("Select and copy the summary from the Summary tab")}ta.remove()}
}
function buildWorkbook(){
  const X=window.XLSX, c=compute(cur), S=settings, [y,m]=cur.split("-"), mon=MN[+m-1];
  const NF="#,##0";
  // Statement sheet
  const s=[];
  s.push([S.clinic]); s.push(["("+S.doctorFull+")"]); s.push([mon+" "+y]); s.push(["MORNING TIME"]); s.push([]);
  s.push(["S#","DATE","PATIENT`S NAME","PROCEDURE","CHARGES"]);
  const mStart=s.length+1;
  c.m.forEach((r,i)=>s.push([i+1,ddmmyy(r.date),r.patient,r.procedure,{t:"n",v:+r.charges,z:NF}]));
  const mEnd=s.length; const mSubRow=s.length+1;
  s.push([null,null,null,"SUB TOTAL",{t:"n",f:c.m.length?`SUM(E${mStart}:E${mEnd})`:"0",v:c.mInc,z:NF}]);
  s.push([]); s.push([]); s.push(["EVENING TIME"]);
  s.push(["S#","DATE","PATIENT`S NAME","PROCEDURE","CHARGES"]);
  const eStart=s.length+1;
  c.e.forEach((r,i)=>s.push([i+1,ddmmyy(r.date),r.patient,r.procedure,{t:"n",v:+r.charges,z:NF}]));
  const eEnd=s.length; const eSubRow=s.length+1;
  s.push([null,null,null,"SUB TOTAL",{t:"n",f:c.e.length?`SUM(E${eStart}:E${eEnd})`:"0",v:c.eInc,z:NF}]);
  s.push([]);
  s.push([null,null,null,"TOTAL",{t:"n",f:`E${eSubRow}+E${mSubRow}`,v:c.total,z:NF}]);
  const ws1=X.utils.aoa_to_sheet(s);
  ws1["!cols"]=[{wch:5},{wch:11},{wch:28},{wch:24},{wch:12}];
  ws1["!merges"]=[0,1,2].map(r=>({s:{r,c:0},e:{r,c:4}}));
  // Summary sheet (same rows and formulas as the 2026 summary file)
  const st="'Statement'!";
  const q=[]; const R=()=>q.length+1;
  const n=(v,f)=>({t:"n",v,f,z:"#,##0.##"});
  q.push(["SUMMARY "+mon,+y]); q.push(["MORNING TIME"]);
  const r1=R(); q.push(["TOTAL INCOME",n(c.mInc,`${st}E${mSubRow}`)]);
  const r2=R(); q.push([c.matSplit?`MATERIAL (SUBTRACT) — share of ${fmt(c.matTotal)}`:"MATERIAL (SUBTRACT)",n(c.mMat,c.matSplit?`ROUND(${c.matTotal}*B${r1}/(B${r1}+B${r1+8}),0)`:undefined)]);
  const r3=R(); q.push(["LAB CHARGES (SUBTRACT)",n(c.mLab)]);
  const r4=R(); q.push(["TOTAL REMAINING",n(c.mRem,`B${r1}-B${r2}-B${r3}`)]);
  q.push([`HOSPITAL SHARE ${S.mHospital}%`,n(c.mHosp,`B${r4}*${S.mHospital/100}`)]);
  const rMD=R(); q.push([`${S.doctor} SHARE ${100-S.mHospital}%`,n(c.mDoc,`B${r4}*${(100-S.mHospital)/100}`)]);
  q.push([]); q.push(["EVENING TIME"]);
  const e1=R(); q.push(["TOTAL INCOME",n(c.eInc,`${st}E${eSubRow}`)]);
  const e2=R(); q.push([c.matSplit?`MATERIAL (SUBTRACT) — share of ${fmt(c.matTotal)}`:"MATERIAL (SUBTRACT)",n(c.eMat,c.matSplit?`${c.matTotal}-B${r2}`:undefined)]);
  const e3=R(); q.push(["LAB CHARGES EVENING (SUBTRACT)",n(c.eLab)]);
  const e4=R(); q.push(["TOTAL REMAINING",n(c.eRem,`B${e1}-B${e2}-B${e3}`)]);
  const rED=R(); q.push([`${S.doctor} SHARE ${S.eDoctor}%`,n(c.eDoc,`B${e4}*${S.eDoctor/100}`)]);
  c.eShares.forEach(sh=>q.push([`${sh.name} SHARE ${sh.pct}%`,n(sh.amt,`B${e4}*${sh.pct/100}`)]));
  q.push([]);
  const t1=R(); q.push([`${S.doctor} TOTAL SHARE`,n(c.docTotal,`B${rED}+B${rMD}`)]);
  const t2=R(); q.push([`${S.tax}% TAX`,n(c.tax,`B${t1}*${S.tax/100}`)]);
  q.push([`${S.doctor} TOTAL AFTER TAX DEDUCTION`,n(c.net,`B${t1}-B${t2}`)]);
  q.push([]);
  const SG=signs();
  if(SG.length){const lines=SG.map(x=>[x.head,x.name,...String(x.title||"").split("\n").filter(Boolean),"","Signature:______________"]);
    const mx=Math.max(...lines.map(l=>l.length));for(let i=0;i<mx;i++)q.push(lines.map(l=>l[i]??""));q.push([]);}
  q.push([]);
  if(S.softCopy.length){q.push(["Soft Copy to:"]);S.softCopy.forEach(l=>q.push(["•  "+l]))}
  const ws2=X.utils.aoa_to_sheet(q); ws2["!cols"]=[{wch:40},{wch:30},{wch:30}];
  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,ws1,"Statement");
  X.utils.book_append_sheet(wb,ws2,"Summary");
  return X.write(wb,{bookType:"xlsx",type:"array"});
}
async function downloadExcel(){
  if(!window.XLSX){toast("The Excel tool did not load. Reload the page and try again.");return}
  const [y,m]=cur.split("-");
  try{await downloads.save({filename:`Statement ${MN[+m-1]} ${y}.xlsx`,data:new Uint8Array(buildWorkbook())});}
  catch(e){ if(e&&e.code==="declined") return; if(e&&e.code==="rate_limited"){toast("A download is already waiting for you to confirm.");return} toast("Download is not available here.");}
}

// ---------- routing ----------
function route(){const h=location.hash.slice(1);tab=["records","statement","summary","year","shares"].includes(h)?h:"records";render()}
window.addEventListener("hashchange",route);

// ---------- boot ----------
route();
render.tried=true;
(function boot(){
  if(!window.firebase||!window.FIREBASE_CONFIG){$("#loginMsg").textContent="Could not load. Check your internet and open the app again.";showLogin(true);return}
  if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs=firebase.firestore();try{fs.settings({cacheSizeBytes:100*1024*1024,merge:true})}catch(e){}
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{
    unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];months={};ready=false;editing=null;
    if(billsUnsub){try{billsUnsub()}catch(e){}}billsUnsub=null;billsKey=null;bills=[];viewBill=null;
    if(!u){uidNow=null;db=null;showLogin(true);syncChip();render();return}
    uidNow=u.uid;showLogin(false);$("#who").textContent=u.email||"";
    db=makeDB(fs,u.uid);downloads=localDownloads;canWrite=true;
    unsubs.push(db.doc("config/settings").onSnapshot(s=>{settings=Object.assign({},DEF,s.exists?s.data():{});loadSig();if(tab!=="shares")render()},e=>{}));
    unsubs.push(db.collection("months").onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>{m[d.id]=d.data()}); months=m; ready=true;
      const ae=document.activeElement;
      if(ae&&ae.closest&&(ae.closest("#recForm")||ae.closest("[data-exp]")||ae.matches("[data-exp]")||ae.closest(".shares")||(tab==="shares"&&ae.tagName!=="BUTTON"))&&ae.value){renderSoft();return}
      render();
    },e=>{toast("Could not load records. Sign out and sign in again.");}));
    render();syncChip();
  });
})();
function showLogin(on){$("#login").hidden=!on;$("#app").hidden=on}
$("#loginForm").onsubmit=async e=>{
  e.preventDefault();const em=$("#lEmail").value.trim(),pw=$("#lPass").value,msg=$("#loginMsg"),btn=$("#lGo");
  const creating=$("#loginForm").dataset.mode==="new";msg.textContent="";btn.disabled=true;
  try{ if(creating) await firebase.auth().createUserWithEmailAndPassword(em,pw); else await firebase.auth().signInWithEmailAndPassword(em,pw); }
  catch(x){const c=x&&x.code||"";msg.textContent=c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")?"Email or password is wrong.":c.includes("email-already")?"This email already has an account. Sign in instead.":c.includes("weak-password")?"Use a password of at least 6 characters.":c.includes("invalid-email")?"That email doesn't look right.":c.includes("network")?"No internet. Connect and try again.":"Could not sign in. Try again."}
  btn.disabled=false;
};
$("#lSwitch").onclick=()=>{const f=$("#loginForm"),n=f.dataset.mode!=="new";f.dataset.mode=n?"new":"in";$("#lTitle").textContent=n?"Create your account":"Sign in";$("#lGo").textContent=n?"Create account":"Sign in";$("#lSwitch").textContent=n?"I already have an account":"New here? Create an account";$("#lPass").autocomplete=n?"new-password":"current-password";$("#loginMsg").textContent=""};
$("#lForgot").onclick=async()=>{const em=$("#lEmail").value.trim(),msg=$("#loginMsg");if(!em){msg.textContent="Type your email first, then tap Forgot password.";return}try{await firebase.auth().sendPasswordResetEmail(em);msg.textContent="We sent a reset link to "+em+"."}catch(x){msg.textContent="Could not send the link. Check the email."}};
$("#signOut").onclick=()=>firebase.auth().signOut();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").then(r=>{r.addEventListener("updatefound",()=>{const w=r.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="activated"&&navigator.serviceWorker.controller)toast("App updated. Close and reopen to use the new version.")})})}).catch(()=>{})}
function renderSoft(){ // refresh tables but keep the form as-is
  const form=$("#recForm"); const vals={}; if(form) form.querySelectorAll("input").forEach(i=>vals[i.id]=i.value);
  const focus=document.activeElement&&document.activeElement.id; render();
  Object.entries(vals).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v}); if(focus&&document.getElementById(focus))document.getElementById(focus).focus();
}
})();
